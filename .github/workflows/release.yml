name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Create the draft release first so all build jobs can attach to it ─────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  # ── Daemon: static binary, no GUI deps ───────────────────────────────────────
  build-daemon:
    name: Daemon — ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: teacha-daemon-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: teacha-daemon-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: teacha-daemon-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Build
        working-directory: src-tauri
        run: |
          cargo build \
            --bin teacha-daemon \
            --no-default-features \
            --release \
            --target ${{ matrix.target }}

      - name: Rename artifact
        run: |
          mv src-tauri/target/${{ matrix.target }}/release/teacha-daemon \
             ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── GUI: Tauri app bundle ─────────────────────────────────────────────────────
  build-gui:
    name: GUI — ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
          - os: macos-13
            platform: macos-intel
            bundles: dmg
          - os: macos-latest
            platform: macos-arm
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}

  # ── Attach daemon binaries and publish ────────────────────────────────────────
  publish:
    name: Attach daemons and publish
    needs: [create-release, build-daemon, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach daemon binaries and publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
